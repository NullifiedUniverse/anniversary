<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M7 16l3-6 3 4 2-3 2 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="logo-text">CryptoLens</span>
    </div>
    <div class="header-actions">
      <button id="refreshBtn" class="icon-btn" title="Refresh prices">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" title="Open settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <nav class="tab-nav">
    <button class="tab active" data-tab="watchlist">Watchlist</button>
    <button class="tab" data-tab="portfolio">Portfolio</button>
    <button class="tab" data-tab="market">Market</button>
  </nav>

  <main class="tab-content">
    <!-- Watchlist Tab -->
    <section id="watchlist" class="tab-panel active">
      <div class="list-controls">
        <div class="sort-btns">
          <button class="sort-btn active" data-sort="default">Default</button>
          <button class="sort-btn" data-sort="24h_desc">24h ↓</button>
          <button class="sort-btn" data-sort="24h_asc">24h ↑</button>
          <button class="sort-btn" data-sort="name_asc">A→Z</button>
        </div>
      </div>
      <div id="watchlistList" class="coin-list">
        <div class="sk-row"><div class="skeleton sk-av"></div><div class="sk-lines"><div class="skeleton sk-name"></div><div class="skeleton sk-sub"></div></div><div class="sk-right"><div class="skeleton sk-price"></div><div class="skeleton sk-chg"></div></div></div>
        <div class="sk-row"><div class="skeleton sk-av"></div><div class="sk-lines"><div class="skeleton sk-name"></div><div class="skeleton sk-sub"></div></div><div class="sk-right"><div class="skeleton sk-price"></div><div class="skeleton sk-chg"></div></div></div>
        <div class="sk-row"><div class="skeleton sk-av"></div><div class="sk-lines"><div class="skeleton sk-name"></div><div class="skeleton sk-sub"></div></div><div class="sk-right"><div class="skeleton sk-price"></div><div class="skeleton sk-chg"></div></div></div>
        <div class="sk-row"><div class="skeleton sk-av"></div><div class="sk-lines"><div class="skeleton sk-name"></div><div class="skeleton sk-sub"></div></div><div class="sk-right"><div class="skeleton sk-price"></div><div class="skeleton sk-chg"></div></div></div>
        <div class="sk-row"><div class="skeleton sk-av"></div><div class="sk-lines"><div class="skeleton sk-name"></div><div class="skeleton sk-sub"></div></div><div class="sk-right"><div class="skeleton sk-price"></div><div class="skeleton sk-chg"></div></div></div>
      </div>
      <button id="manageWatchlistBtn" class="text-btn">+ Manage Watchlist</button>
    </section>

    <!-- Portfolio Tab -->
    <section id="portfolio" class="tab-panel">
      <div id="portfolioSummary" class="portfolio-summary hidden">
        <div class="ps-item">
          <span class="ps-label">Total Value</span>
          <span id="portfolioTotal" class="ps-value">&mdash;</span>
        </div>
        <div class="ps-item">
          <span class="ps-label">Total P&amp;L</span>
          <span id="portfolioPnl" class="ps-value">&mdash;</span>
        </div>
      </div>
      <div id="portfolioList" class="coin-list"></div>
      <button id="addHoldingBtn" class="text-btn">+ Add Holding</button>
      <div id="addHoldingForm" class="form-panel hidden">
        <div class="form-group">
          <label>Coin</label>
          <div class="search-wrap">
            <input type="text" id="holdingCoinSearch" placeholder="Search BTC, ETH&hellip;" autocomplete="off">
            <div id="holdingSearchResults" class="search-dropdown hidden"></div>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Amount</label>
            <input type="number" id="holdingAmount" placeholder="0.0" min="0" step="any">
          </div>
          <div class="form-group">
            <label>Avg Buy (<span id="holdingCurSym">$</span>)</label>
            <input type="number" id="holdingBuyPrice" placeholder="0.00" min="0" step="any">
          </div>
        </div>
        <div class="form-actions">
          <button id="cancelHoldingBtn" class="btn-ghost">Cancel</button>
          <button id="saveHoldingBtn" class="btn-primary">Add Holding</button>
        </div>
      </div>
    </section>

    <!-- Market Tab (built dynamically by JS) -->
    <section id="market" class="tab-panel"></section>
  </main>

  <footer class="app-footer">
    <span id="lastUpdated" class="footer-ts">&mdash;</span>
    <span class="footer-credit">Powered by CoinGecko</span>
  </footer>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
