<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#0a0e1a"/>
  <!-- Candlestick chart -->
  <!-- Candle 1: bearish -->
  <line x1="32" y1="22" x2="32" y2="44" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <rect x="22" y="44" width="20" height="30" rx="2" fill="#ef4444"/>
  <line x1="32" y1="74" x2="32" y2="92" stroke="#ef4444" stroke-width="4" stroke-linecap="round"/>
  <!-- Candle 2: bullish -->
  <line x1="64" y1="18" x2="64" y2="38" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <rect x="54" y="38" width="20" height="36" rx="2" fill="#22c55e"/>
  <line x1="64" y1="74" x2="64" y2="96" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
  <!-- Candle 3: bullish orange -->
  <line x1="96" y1="14" x2="96" y2="30" stroke="#f7931a" stroke-width="4" stroke-linecap="round"/>
  <rect x="86" y="30" width="20" height="42" rx="2" fill="#f7931a"/>
  <line x1="96" y1="72" x2="96" y2="90" stroke="#f7931a" stroke-width="4" stroke-linecap="round"/>
  <!-- Floor line -->
  <line x1="14" y1="106" x2="114" y2="106" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-linecap="round"/>
</svg>
